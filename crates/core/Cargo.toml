[package]
name = "itemgrid-core"
edition.workspace = true
version.workspace = true
description = "What a connected Surface Duo is doing, and the safe ways to act on it"

[dependencies]
png = "0.17"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
bzip2 = "0.6"
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The keyring's backend is the platform's: the Secret Service on Linux, the
# Credential Manager on Windows.
[target.'cfg(unix)'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
nusb = "0.2"
if-addrs = "0.15"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
