[package]
name = "item-recovery"
edition.workspace = true
version.workspace = true
description = "On the Duo, booted from RAM: item/grid's recovery - init, the USB gadget and an adb daemon of its own, nothing else"

[[bin]]
name = "item-recovery"
path = "src/main.rs"

[dependencies]
libc = "0.2"
fontdue = { version = "0.9", default-features = false }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

# On the phone: sha256 by the CPU's own instructions (the Snapdragon 855
# has them), about ten times the plain code's 224 MB/s.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
