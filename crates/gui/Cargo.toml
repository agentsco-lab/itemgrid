[package]
name = "cradle-gui"
edition.workspace = true
version.workspace = true
description = "Cradle's window over cradle-core (GTK4, libadwaita)"

[[bin]]
name = "cradle-gui"
path = "src/main.rs"

[dependencies]
cradle-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
async-channel = "2"
webkit = { package = "webkit6", version = "0.5" }
