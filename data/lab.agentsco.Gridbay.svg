<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#e01b6c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="116" rx="50" ry="7" fill="url(#floor)"/>
  <!-- a gridbay, the Duo resting in it -->
  <path d="M8 78 Q64 134 120 78" fill="none" stroke="#f6f5f4" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
  <!-- the left panel -->
  <rect x="12" y="10" width="49" height="84" rx="9" fill="url(#body)"/>
  <rect x="16" y="14" width="41" height="76" rx="6" fill="url(#glass)"/>
  <!-- the hinge -->
  <rect x="61" y="20" width="6" height="64" rx="3" fill="#77767b"/>
  <!-- the right panel -->
  <rect x="67" y="10" width="49" height="84" rx="9" fill="url(#body)"/>
  <rect x="71" y="14" width="41" height="76" rx="6" fill="url(#glass)"/>
</svg>
