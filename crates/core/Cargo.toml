[package]
name = "gridbay-core"
edition.workspace = true
version.workspace = true
description = "What a connected Surface Duo is doing, and the safe ways to act on it"

[dependencies]
png = "0.17"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
bzip2 = "0.6"
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
