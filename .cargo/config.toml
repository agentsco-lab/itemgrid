# duo-motion runs on the Duo: cargo build --release --target aarch64-unknown-linux-gnu -p duo-motion
# (std only - the cross toolchain's glibc is older than the phone's).
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# The Windows installer is cross-built here: apt install mingw-w64; rustup target add x86_64-pc-windows-gnu.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
